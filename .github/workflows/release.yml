name: Release

# Push a tag like v1.2.0 to build a signed APK and publish it as a GitHub release.
# Requires the repository secrets described in docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the release

jobs:
  release:
    name: Signed release APK and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set — see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK and app bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Verify the APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::$APK not found (unsigned build?)"; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          cp "$APK" "pocket-reviewer-${VERSION_NAME}.apk"
          # The .aab is what Google Play takes (see docs/PLAY_STORE.md).
          cp app/build/outputs/bundle/release/app-release.aab "pocket-reviewer-${VERSION_NAME}.aab"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "pocket-reviewer-${VERSION_NAME}.apk" "pocket-reviewer-${VERSION_NAME}.aab" \
            --title "Pocket Reviewer ${VERSION_NAME}" \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
